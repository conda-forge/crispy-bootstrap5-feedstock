# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: crispy-bootstrap5
  version: "2026.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/crispy_bootstrap5-${{ version }}.tar.gz
  sha256: e7f5adb36acfbb456444c46e82c436931c796c539e9c620be4fa9dc9c9d6679c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >61
  run:
    - python >=${{ python_min }},<4.0
    - django-crispy-forms >=2.3
    - django >=4.2
    # - pytest-django
    # - pytest
    # - pytest-django
    # - pytest

tests:
  - python:
      imports:
        - crispy_bootstrap5
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  summary: Bootstrap5 template pack for django-crispy-forms
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/django-crispy-forms/crispy-bootstrap5

extra:
  recipe-maintainers:
    - rxm7706
